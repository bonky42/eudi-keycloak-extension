# Page de connexion du fournisseur d'identité OID4VP.
#
# Ce bundle DOIT vivre sous theme-resources/messages/. Placé sous theme/<nom>/.../messages/, il se
# charge depuis un répertoire mais PAS depuis un JAR de provider, qui est la forme de livraison de
# cette extension. Vérifié dans les deux sens le 2026-08-17 en construisant la console de compte.
#
# Toutes les chaînes affichées viennent d'ici, y compris celles du script : le gabarit les écrit
# dans des attributs data- que le script relit, parce qu'une chaîne en JavaScript ne peut pas être
# traduite.
#
# Les fichiers .properties de Keycloak sont lus en UTF-8 : les accents s'écrivent directement.

oid4vpLoginTitle=Connectez-vous avec votre portefeuille

# Affiché avant que le porteur n'ouvre son portefeuille. OpenID4VP 1.0 §6.2 demande au vérifieur
# d'afficher le motif d'une requête et ne définit aucun moyen de le transmettre au portefeuille :
# cette page est donc le seul endroit où il peut apparaître.
oid4vpDefaultPurpose=Ce site demande à votre portefeuille les informations ci-dessous, afin de vous connecter.
oid4vpSharedIntro=Votre portefeuille se verra demander :

oid4vpScanInstructions=Scannez le code avec le portefeuille de votre téléphone. Si votre portefeuille est sur cet appareil, utilisez plutôt le lien.
oid4vpQrAlt=Un code QR contenant la demande. Si vous ne pouvez pas le scanner, utilisez plutôt le lien ci-dessous.
oid4vpOpenWallet=Ouvrir mon portefeuille sur cet appareil
oid4vpLinkHint=Rien ne s'est passé ? Aucun portefeuille n'est installé sur cet appareil — scannez plutôt le code avec votre téléphone.

oid4vpWaiting=En attente de votre portefeuille…
# {0} est le temps restant, substitué par la page. Conserver le repère.
oid4vpExpiresIn=Cette demande expire dans {0}.
oid4vpExpired=Cette demande a expiré.
oid4vpRejected=Votre portefeuille n'a pas mené la demande à son terme.
oid4vpConnectionLost=Contact perdu avec le serveur.
oid4vpRetry=Recommencer

# Libellés lisibles des claims qu'une requête peut demander. Un claim sans libellé ici est nommé par
# son nom technique plutôt que masqué : la page ne peut jamais demander ce qu'elle n'affiche pas.
oid4vpClaim.sub=votre identifiant de compte
oid4vpClaim.given_name=prénom
oid4vpClaim.family_name=nom
oid4vpClaim.birthdate=date de naissance
oid4vpClaim.email=adresse de courriel
oid4vpClaim.age_over_18=le fait que vous ayez plus de 18 ans
