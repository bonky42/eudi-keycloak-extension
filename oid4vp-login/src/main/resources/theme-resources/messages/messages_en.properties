# Login page for the OID4VP identity provider.
#
# This bundle MUST live under theme-resources/messages/. Shipped under theme/<name>/.../messages/ it
# loads when the theme comes from a directory and NOT when it comes from a provider JAR, which is
# how this extension ships. Verified both ways on 2026-08-17 while building the account console.
#
# Every string the page shows comes from here, the script's included: the template writes them into
# data- attributes and the script reads them back, because a string in JavaScript cannot be
# translated.

oid4vpLoginTitle=Sign in with your wallet

# Shown before the holder opens their wallet. OpenID4VP 1.0 section 6.2 asks the verifier to display
# the purpose of a request and defines no way to send it to the wallet, so this page is the only
# place it can appear. An administrator can replace it with their own text or their own key.
oid4vpDefaultPurpose=This site is asking your wallet for the information below, so it can sign you in.
oid4vpSharedIntro=Your wallet will be asked for:

oid4vpScanInstructions=Scan the code with the wallet on your phone. If your wallet is on this device, use the link instead.
oid4vpQrAlt=A QR code holding the wallet request. If you cannot scan it, use the link below instead.
oid4vpOpenWallet=Open my wallet on this device
oid4vpLinkHint=Nothing happened? No wallet is installed on this device — scan the code with your phone instead.

oid4vpWaiting=Waiting for your wallet…
# {0} is the time remaining, substituted by the page. Keep the placeholder.
oid4vpExpiresIn=This request expires in {0}.
oid4vpExpired=This request has expired.
oid4vpRejected=Your wallet did not complete the request.
oid4vpConnectionLost=Lost contact with the server.
oid4vpRetry=Start again

# Human labels for the claims a request may ask for. A claim with no label here is named by its
# technical name rather than hidden, so the page can never ask for something it does not show.
oid4vpClaim.sub=your account identifier
oid4vpClaim.given_name=first name
oid4vpClaim.family_name=last name
oid4vpClaim.birthdate=date of birth
oid4vpClaim.email=email address
oid4vpClaim.age_over_18=whether you are over 18
