# Labels contributed by this console.
#
# The menu label is resolved from the LAST SEGMENT of the route path (see PageNav), so the key for
# the tab is exactly `cards`. Renaming the route without renaming this key leaves the menu showing
# the raw key.
cards=Request a card
cards.description=Cards this realm can issue to your wallet.
cards.request=Request
cards.loading=Loading the available cards
cards.empty=This realm defines no issuable card.
cards.error=The card list could not be loaded: {{reason}}

# Also shipped under theme-resources/, not only under the theme itself.
#
# Keycloak merges theme-resources message bundles into every theme, and that path proved to work
# from a provider JAR on 2026-08-17 when the theme's own bundle did not. Keeping both costs a few
# hundred bytes and removes a whole class of "the tab shows its raw key" failures.
